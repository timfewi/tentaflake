# Mirrors the CI gates (.github/workflows/) — see CONTRIBUTING.md for setup.
# Tools (shellcheck, cargo, nix) come from the environment; only gitleaks is
# fetched by pre-commit itself.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: nixfmt
        name: nix fmt
        entry: nix fmt
        language: system
        types: [nix]
        pass_filenames: false
