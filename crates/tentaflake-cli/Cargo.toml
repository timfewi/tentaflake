[package]
name = "tentaflake-cli"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Operator CLI for tentaflake agent hosts"

[dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
tentaflake-admission = { path = "../tentaflake-admission" }

[[bin]]
name = "tentaflake"
path = "src/main.rs"
