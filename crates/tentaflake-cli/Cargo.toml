[package]
name = "tentaflake-cli"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Operator CLI for tentaflake agent hosts"

[dependencies]
bytes = "=1.11.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.8.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
libc = "=0.2.190"
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
tentaflake-admission = { path = "../tentaflake-admission" }
tokio = { version = "=1.53.2", features = ["rt", "net", "time", "sync"] }

[[bin]]
name = "tentaflake"
path = "src/main.rs"
