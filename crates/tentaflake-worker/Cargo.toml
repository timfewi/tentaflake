[package]
name = "tentaflake-worker"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Fail-closed disposable tool-worker orchestrator for tentaflake"

[[bin]]
name = "tentaflake-worker"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4.45", default-features = false }
