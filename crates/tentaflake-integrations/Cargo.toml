[package]
name = "tentaflake-integrations"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Read-only enterprise connector and evidence-only advisory policy boundaries"

[lib]
path = "src/lib.rs"

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
