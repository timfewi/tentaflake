[package]
name = "tentaflake-control"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Approval-bound Unix configuration control and durable fixed-target build receipts"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tentaflake-control"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml_edit = { version = "0.25.17", features = ["serde"] }
