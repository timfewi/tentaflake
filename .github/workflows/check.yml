name: Check

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Comparison commit (40-char SHA) for a manual re-run; empty or unavailable history runs full inventory'
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'explicit' || 'automatic' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.filter.outputs.builds }}
      runtime: ${{ steps.filter.outputs.runtime }}
      research: ${{ steps.filter.outputs.research }}
      nix: ${{ steps.filter.outputs.nix }}
      evaluate: ${{ steps.filter.outputs.evaluate }}
      generated: ${{ steps.filter.outputs.generated }}
      rust: ${{ steps.filter.outputs.rust }}
      cli: ${{ steps.filter.outputs.cli }}
      broker: ${{ steps.filter.outputs.broker }}
      worker: ${{ steps.filter.outputs.worker }}
      control: ${{ steps.filter.outputs.control }}
      integrations: ${{ steps.filter.outputs.integrations }}
      activity: ${{ steps.filter.outputs.activity }}
      workloads: ${{ steps.filter.outputs.workloads }}
      pi: ${{ steps.filter.outputs.pi }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
      selection: ${{ steps.filter.outputs.selection }}
      static: ${{ steps.filter.outputs.static }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check CI selection with real Git histories
        run: |
          python3 scripts/test_ci_changes.py
          python3 scripts/test_eval_flake.py

      - name: Documentation inventory and untracked working notes
        run: python3 scripts/test_docs_inventory.py

      # One path policy for PRs, pushes and manual dispatch: every affected
      # lint, unit, evaluation, build and VM gate runs. Unknown history runs all.
      - name: Detect affected checks
        id: filter
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/ci_changes.py "$BASE_SHA" "$HEAD_SHA" \
            --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whitespace
        # PR checkouts are merge commits; inspect their first-parent diff.
        run: git show --format= --check --first-parent HEAD

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: needs.changes.outputs.nix == 'true'
        with:
          extra-conf: |
            accept-flake-config = true

      # Contributor tools use the pinned binary cache. Uploading that store
      # again costs more than these source checks; cache only the build job.
      - name: nix fmt check
        if: needs.changes.outputs.static == 'true'
        run: nix develop --command just formatter-test

      - name: Shallow flake source regression
        if: needs.changes.outputs.static == 'true'
        # Use the installed CI Nix, as the explicit evaluation job does.
        run: python3 scripts/test_eval_flake_nix.py

      - name: Adapter catalog and documentation drift
        if: needs.changes.outputs.static == 'true'
        run: nix develop --command just catalog-check

      - name: Nix lint
        if: needs.changes.outputs.static == 'true'
        run: |
          nix develop --command deadnix --fail .
          nix develop --command statix check .

      - name: cargo fmt
        if: needs.changes.outputs.rust == 'true'
        run: nix develop --command cargo fmt --all -- --check

      - name: Workflow lint
        if: needs.changes.outputs.static == 'true'
        run: nix develop --command actionlint .github/workflows/*.yml

      - name: Optional host API protocol and action tests
        if: needs.changes.outputs.static == 'true'
        run: nix develop --command just host-api-test

      - name: Rust lint and unit tests
        if: needs.changes.outputs.rust == 'true'
        env:
          CHECK_CLI: ${{ needs.changes.outputs.cli }}
          CHECK_BROKER: ${{ needs.changes.outputs.broker }}
          CHECK_WORKER: ${{ needs.changes.outputs.worker }}
          CHECK_CONTROL: ${{ needs.changes.outputs.control }}
          CHECK_INTEGRATIONS: ${{ needs.changes.outputs.integrations }}
          CHECK_ACTIVITY: ${{ needs.changes.outputs.activity }}
          CHECK_WORKLOADS: ${{ needs.changes.outputs.workloads }}
        run: |
          packages=()
          for crate in cli broker worker control integrations activity workloads; do
            variable="CHECK_${crate^^}"
            if [[ "${!variable}" == true ]]; then
              packages+=(--package "tentaflake-$crate")
            fi
          done
          # Refuse an inconsistent policy instead of silently widening the suite.
          test "${#packages[@]}" -gt 0
          nix develop --command cargo clippy "${packages[@]}" --all-targets -- -D warnings
          nix develop --command cargo test "${packages[@]}"

      # Via the devShell, not the runner's apt shellcheck: the two versions
      # disagree (Ubuntu's flags SC2015 where 0.11 does not), so an unpinned
      # binary means "clean locally" and "clean in CI" are different claims.
      # flake.lock pins this one, and it is the same one `nix develop` gives.
      - name: shellcheck
        if: needs.changes.outputs.static == 'true'
        run: nix develop --command shellcheck installer/*.sh scripts/*.sh

  # Share one store across affected builds and VMs on every PR and push.
  build:
    needs: changes
    if: needs.changes.outputs.builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Optional Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        timeout-minutes: 3
        continue-on-error: true
        with:
          use-flakehub: false

      # Evaluation is not runtime evidence; selected VMs run below.
      # Read-only flake evaluation cannot instantiate an uncached closureInfo
      # derivation. Build the non-VM policy gates first; they materialize the
      # exact research closures without widening any sandbox mount.
      - name: Prepare exact evaluation closures and source filesets
        if: needs.changes.outputs.evaluate == 'true'
        run: |
          for check in research-policy module-evaluation rust-package-sources; do
            nix build --no-link ".#checks.x86_64-linux.$check"
          done

      - name: nix flake check (eval)
        if: needs.changes.outputs.evaluate == 'true'
        run: python3 scripts/eval_flake.py

      # Build only selected packages/checks. A Rust edit does not require the
      # Research closures or host evaluation; worker edits include its image.
      - name: nix build (non-VM checks)
        if: needs.changes.outputs.nix == 'true'
        env:
          CHECK_EVALUATE: ${{ needs.changes.outputs.evaluate }}
          CHECK_DEVCONTAINER: ${{ needs.changes.outputs.devcontainer }}
          CHECK_CLI: ${{ needs.changes.outputs.cli }}
          CHECK_BROKER: ${{ needs.changes.outputs.broker }}
          CHECK_WORKER: ${{ needs.changes.outputs.worker }}
          CHECK_CONTROL: ${{ needs.changes.outputs.control }}
          CHECK_INTEGRATIONS: ${{ needs.changes.outputs.integrations }}
          CHECK_ACTIVITY: ${{ needs.changes.outputs.activity }}
          CHECK_WORKLOADS: ${{ needs.changes.outputs.workloads }}
          CHECK_PI: ${{ needs.changes.outputs.pi }}
          CHECK_RUST: ${{ needs.changes.outputs.rust }}
        run: |
          selected_checks=()
          if [[ "$CHECK_DEVCONTAINER" == true ]]; then
            selected_checks+=(".#checks.x86_64-linux.devcontainer-cli")
          fi
          if [[ "$CHECK_EVALUATE" == true ]]; then
            selected_checks+=(".#checks.x86_64-linux.image-pinning" ".#checks.x86_64-linux.agent-adapters" ".#checks.x86_64-linux.hardening-journald")
            selected_checks+=(".#checks.x86_64-linux.host-api" ".#checks.x86_64-linux.host-api-evaluation")
            selected_checks+=(".#checks.x86_64-linux.system-schema" ".#checks.x86_64-linux.control-evaluation" ".#checks.x86_64-linux.ci-vm-selection")
            selected_checks+=(".#checks.x86_64-linux.pi-runtime-evaluation" ".#checks.x86_64-linux.local-image-proof")
          fi
          for crate in cli broker worker control integrations activity workloads; do
            variable="CHECK_${crate^^}"
            if [[ "${!variable}" == true ]]; then
              selected_checks+=(".#checks.x86_64-linux.tentaflake-$crate")
            fi
          done
          if [[ "$CHECK_WORKER" == true ]]; then
            selected_checks+=(".#checks.x86_64-linux.tentaflake-worker-image")
          fi
          if [[ "$CHECK_PI" == true ]]; then
            selected_checks+=(".#checks.x86_64-linux.tentaflake-pi" ".#checks.x86_64-linux.tentaflake-pi-recovery" ".#checks.x86_64-linux.pi-runtime-module-graph")
            selected_checks+=(".#packages.x86_64-linux.tentaflake-pi-image")
          fi
          if [[ "$CHECK_RUST" == true ]]; then
            selected_checks+=(".#checks.x86_64-linux.rust-package-sources")
          fi
          for ((offset=0; offset<${#selected_checks[@]}; offset+=4)); do
            nix build --no-link "${selected_checks[@]:offset:4}"
          done

      # The explicitly ignored immutable-store contract: real Unix transport,
      # store templates and restart uncertainty. The UI adapter variant needs a
      # selected UI checkout and stays a documented local test.
      - name: Immutable control fixture contract
        if: needs.changes.outputs.control == 'true'
        run: |
          fixture=$(nix build --no-link --print-out-paths .#control-test-fixture)
          cli=$(nix build --no-link --print-out-paths .#tentaflake-cli)
          TENTAFLAKE_CONTROL_FIXTURE="$fixture" TENTAFLAKE_REAL_NORMALIZER="$cli/bin/tentaflake" \
            nix develop --command cargo test --locked -p tentaflake-control --test immutable_unix -- \
            --ignored --exact immutable_unix_approval_build_and_recovery_contract

      - name: nix build (tentaflake toplevel)
        if: needs.changes.outputs.evaluate == 'true' && needs.changes.outputs.runtime == 'true'
        run: nix build .#nixosConfigurations.tentaflake.config.system.build.toplevel --no-link

      - name: generated installed flake
        if: needs.changes.outputs.generated == 'true'
        run: nix develop --command ./scripts/generated-flake-test.sh

      - name: nix build (runtime VM integration test)
        if: needs.changes.outputs.runtime == 'true'
        run: |
          nix build --no-link -L .#checks.x86_64-linux.vm-integration
          nix build --no-link -L .#checks.x86_64-linux.worker-drain-wakeup

      - name: nix build (research VM integration test)
        if: needs.changes.outputs.research == 'true'
        run: nix build --no-link -L .#checks.x86_64-linux.research-integration

      # Component VMs: admitted Pi capsules and the workload observer, including
      # its 64-binding lease scale test. One VM at a time bounds runner load.
      - name: nix build (component VM tests)
        if: needs.changes.outputs.pi == 'true' || needs.changes.outputs.workloads == 'true'
        env:
          CHECK_PI: ${{ needs.changes.outputs.pi }}
          CHECK_WORKLOADS: ${{ needs.changes.outputs.workloads }}
        run: |
          if [[ "$CHECK_PI" == true ]]; then
            nix build --no-link -L .#checks.x86_64-linux.pi-runtime-vm
          fi
          if [[ "$CHECK_WORKLOADS" == true ]]; then
            nix build --no-link -L .#checks.x86_64-linux.workload-mapping-vm
            nix build --no-link -L .#checks.x86_64-linux.workload-mapping-scale-vm
          fi
