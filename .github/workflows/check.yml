name: Check

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      vm: ${{ steps.filter.outputs.vm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Keep the required VM job visible, but avoid its expensive build when a
      # change only touches Markdown documentation.
      - name: Detect VM-relevant changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$files" | grep -qEv '(^docs/|\.md$)'; then
            echo "vm=true" >> "$GITHUB_OUTPUT"
          else
            echo "vm=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          # No FlakeHub account; skip the doomed OIDC login and use the GH cache.
          use-flakehub: false

      # Eval-only: the VM test in `checks` needs /dev/kvm, which not every runner
      # has. Evaluating still catches assertion/module errors; the VM is actually
      # built in the separate `vm-test` job below.
      - name: nix flake check (eval)
        run: nix flake check --no-build

      # `nix flake check` above is eval-only, so the non-VM checks still need an
      # explicit build. The Rust package check proves the workspace also builds
      # through the pinned Nix toolchain, not only the runner toolchain below.
      - name: nix build (non-VM checks)
        run: |
          nix build --no-link \
            .#checks.x86_64-linux.image-pinning \
            .#checks.x86_64-linux.tentaflake-broker \
            .#checks.x86_64-linux.tentaflake-cli \
            .#checks.x86_64-linux.tentaflake-worker \
            .#checks.x86_64-linux.tentaflake-worker-image

      - name: nix build (tentaflake toplevel)
        run: nix build .#nixosConfigurations.tentaflake.config.system.build.toplevel --no-link

      - name: nix fmt check
        run: nix fmt -- --ci

      - name: Nix lint
        run: |
          nix develop --command statix check .
          nix develop --command deadnix --fail .

      - name: cargo fmt
        run: nix develop --command cargo fmt --all -- --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: nix develop --command cargo test --workspace

      # Via the devShell, not the runner's apt shellcheck: the two versions
      # disagree (Ubuntu's flags SC2015 where 0.11 does not), so an unpinned
      # binary means "clean locally" and "clean in CI" are different claims.
      # flake.lock pins this one, and it is the same one `nix develop` gives.
      - name: shellcheck
        run: nix develop --command shellcheck installer/*.sh scripts/*.sh

  # Own job: the VM test derivation carries requiredSystemFeatures = kvm, so a
  # KVM-less or slow runner degrades this one job instead of the whole check.
  vm-test:
    needs: changes
    if: needs.changes.outputs.vm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      - name: nix build (VM integration test)
        run: nix build .#checks.x86_64-linux.vm-integration -L
