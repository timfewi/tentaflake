name: Check

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks only: formatting, lint, Rust, offline catalog checks and flake
  # evaluation without building. Host builds and VM tests are manual steps.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whitespace
        # PR checkouts are merge commits; inspect their first-parent diff.
        run: git show --format= --check --first-parent HEAD

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Fast checks and flake evaluation
        env:
          TENTAFLAKE_NO_BANNER: "1"
        run: nix develop --command just check
